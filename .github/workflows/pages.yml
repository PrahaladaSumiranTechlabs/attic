name: pages

# Publishes the landing page to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# Without that, this workflow runs and the deploy step fails with a 404,
# because there is no Pages site to deploy into yet.

on:
  push:
    branches: [main]
    # Only rebuild when something the site is actually made of changes.
    paths:
      - 'public/landing.html'
      - 'public/favicon.svg'
      - 'public/icon.png'
      - 'scripts/build-site.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the site
        # Rewrites absolute asset paths to relative and points app-only links
        # at the repo. Relative paths are correct both on the custom domain at
        # the root and on the project path (/attic/) before DNS resolves, so
        # the site is not broken during the changeover. Fails the build if any
        # reference would 404.
        run: node scripts/build-site.js
        env:
          ATTIC_SITE_URL: https://attic.programmershop.in/
          # Writes the CNAME file Pages needs to answer on a custom domain.
          # Requires a DNS CNAME: attic.programmershop.in -> <owner>.github.io
          ATTIC_CNAME: attic.programmershop.in

      # enablement turns Pages on via the API if it is not on already, which is
      # otherwise a manual visit to Settings -> Pages before the first deploy
      # can work at all. If this still fails, that setting is the thing to check.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
