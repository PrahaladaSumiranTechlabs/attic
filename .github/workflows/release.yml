name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Each OS builds its own installers because electron-builder cannot produce a
# signed macOS .dmg from Linux. The three jobs upload into one draft release,
# which you review and publish by hand.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: Verify the server still runs standalone
        # The desktop app is a wrapper. If server.js ever stops working on its
        # own, everyone deploying to a Pi or a VPS is broken, so check it here.
        run: node scripts/smoke-test.js

      - name: Verify everything the server needs will be in the package
        run: node scripts/check-package.js

      - name: Verify the QR encoder against a reference implementation
        # Skips itself if the reference will not install. A QR that is subtly
        # wrong still looks exactly like a QR, so this is the only real check.
        run: pip install qrcode && node scripts/check-qr.js
        continue-on-error: true

      - name: Verify Electron's bundled Node can run the server
        # fork() runs server.js on Electron's Node, not the system one, and the
        # server needs node:sqlite (22.5+). Electron 33 and earlier bundle Node
        # 20 and fail at require(). Catch that here rather than in a release.
        run: node scripts/check-electron-node.js

      - name: Build
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
